name: Sonde comptes
on: workflow_dispatch
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          q() { for i in 1 2 3; do r=$(curl -s -A "Bayyin/1.0 (github.com/agozel5/bayyin)" "https://world.openfoodfacts.org/$1.json?page_size=1&fields=code" | python3 -c "import sys,json;print(json.load(sys.stdin).get('count'))" 2>/dev/null); [ -n "$r" ] && { echo "$r"; break; }; sleep 20; done; sleep 6; }
          {
            echo "monde: $(q 'state/en:product-name-completed')"
            echo "monde avec ingredients: $(q 'state/en:ingredients-completed')"
            echo "france: $(q 'country/en:france')"
            echo "france avec ingredients: $(q 'country/en:france/state/en:ingredients-completed')"
            echo "france avec ingredients (fr): $(q 'country/en:france/state/en:ingredients-completed/language/fr')"
          } > docs/probe-count.txt
          cat docs/probe-count.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add docs/probe-count.txt; git commit -m "sonde comptes"; git push
