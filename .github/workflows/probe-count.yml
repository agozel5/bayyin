name: Sonde comptes
on: workflow_dispatch
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for u in "country/en:france.json?page_size=1&fields=code" "api/v2/search?countries_tags_en=france&page_size=1&fields=code" "cgi/search.pl?action=process&json=1&page_size=1&tagtype_0=countries&tag_contains_0=contains&tag_0=france&fields=code" "api/v2/search?states_tags=en:ingredients-completed&countries_tags=en:france&page_size=1&fields=code"; do
            echo "== $u"; curl -s -m 90 -w " [HTTP %{http_code} %{time_total}s]" -A "Bayyin/1.0 (github.com/agozel5/bayyin)" "https://world.openfoodfacts.org/$u" | head -c 400; echo; sleep 10
          done > docs/probe-count.txt 2>&1
          cat docs/probe-count.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add docs/probe-count.txt; git commit -m "sonde comptes"; git push
