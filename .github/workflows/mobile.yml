name: App mobile

# Compile l'application native, uniquement à la demande (onglet Actions → App mobile → Run workflow),
# une fois les modifications validées.
#  - Android : fichier APK installable, publié dans la release « android-latest ».
#  - iOS : vérification que l'app compile (l'installation sur iPhone passe par Expo Go ou EAS).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Plateforme à compiler"
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}-${{ inputs.only || 'both' }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ inputs.only != 'ios' }}
    runs-on: ubuntu-latest
    # Beaucoup de modules natifs compilés depuis leurs sources : la première compilation est longue
    timeout-minutes: 150
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Dépendances
        run: scripts/ci-run.sh "Installation des dépendances" npm run setup
      - name: Versions retenues
        run: node -e "const p=require('./package.json');console.log(JSON.stringify(p.dependencies,null,2))"
      - name: Vérification du code JavaScript
        run: scripts/ci-run.sh "Bundle JavaScript" npx expo export --platform android --output-dir dist-check
      - name: Projet Android
        run: scripts/ci-run.sh "expo prebuild android" npx expo prebuild --platform android --no-install
      - name: Compilation de l'APK
        working-directory: mobile/android
        run: ../scripts/ci-run.sh "Gradle assembleRelease" ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ../Bayyin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bayyin-android
          path: Bayyin.apk
      - name: Publier dans la release android-latest
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest Bayyin.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Bayyin pour Android (dernière version)" \
            --notes "APK compilé automatiquement depuis le commit ${GITHUB_SHA::7}. Sur le téléphone Android : télécharger Bayyin.apk, l'ouvrir, puis autoriser l'installation depuis cette source."

  ios:
    if: ${{ inputs.only != 'android' }}
    runs-on: macos-26
    timeout-minutes: 150
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # Expo récent demande Swift 6.2, donc Xcode 26 ou plus
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dépendances
        run: scripts/ci-run.sh "Installation des dépendances" npm run setup
      - name: Vérification du code JavaScript
        run: scripts/ci-run.sh "Bundle JavaScript iOS" npx expo export --platform ios --output-dir dist-check
      - name: Projet iOS
        run: scripts/ci-run.sh "expo prebuild ios" npx expo prebuild --platform ios --no-install
      - name: Dépendances iOS (CocoaPods)
        working-directory: mobile/ios
        run: ../scripts/ci-run.sh "pod install" pod install
      - name: Compilation pour le simulateur
        run: |
          ws=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$ws" .xcworkspace)
          scripts/ci-run.sh "xcodebuild" xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO -quiet build
