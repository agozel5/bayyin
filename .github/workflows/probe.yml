name: Sonde produits (temporaire)
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p docs/probe
          for c in 5010477371218 5449000350848; do
            curl -s -A "Bayyin/1.0 (github.com/agozel5/bayyin)" "https://world.openfoodfacts.org/api/v2/product/$c.json" > docs/probe/$c.json || true
          done
          F=$(node -e "import('./public/lib/off.js').then(m=>console.log(m.FIELDS))")
          for c in 5010477371218 5449000350848; do
            curl -s -A "Bayyin/1.0 (github.com/agozel5/bayyin)" "https://world.openfoodfacts.org/api/v2/product/$c.json?fields=$F" > docs/probe/$c-app.json || true
          done
      - if: always()
        run: |
          git add docs/probe
          git -c user.name="bayyin-bot" -c user.email="actions@users.noreply.github.com" commit -m "Sonde produits" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep 5; done
