name: Sonde CosIng (temporaire)
on:
  push:
    branches: [main]
    paths: ["scripts/probe-cosing.mjs"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-cosing.mjs
      - run: |
          git add docs/probe-cosing.txt
          git -c user.name="bayyin-bot" -c user.email="actions@users.noreply.github.com" commit -m "Sonde CosIng" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
