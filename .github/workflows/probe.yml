name: Sonde recherche (temporaire)
on:
  push:
    branches: [main]
    paths: ["scripts/probe-search.sh", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/probe-search.sh > docs/probe-search.txt 2>&1 || true
      - run: |
          git add docs/probe-search.txt
          git -c user.name="bayyin-bot" -c user.email="actions@users.noreply.github.com" commit -m "Sonde recherche" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep 5; done
