name: Sonde additifs (temporaire)
on:
  push:
    branches: [main]
    paths: ["scripts/probe-additives.mjs", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-additives.mjs > docs/probe-additives.txt 2>&1 || true
      - run: |
          git add docs/probe-additives.txt
          git -c user.name="bayyin-bot" -c user.email="actions@users.noreply.github.com" commit -m "Sonde additifs" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep 5; done
