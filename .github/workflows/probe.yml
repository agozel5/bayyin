name: Sonde Overpass (temporaire)
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Essais
        timeout-minutes: 10
        run: |
          rm -f docs/probe-overpass.txt
          Q='[out:json][timeout:60];(nwr["diet:halal"~"^(yes|only)$"](48,2,50,4););out tags center qt;'
          for u in https://overpass-api.de/api/interpreter https://lz4.overpass-api.de/api/interpreter https://z.overpass-api.de/api/interpreter; do
            echo "== $u (UA + Accept)" >> docs/probe-overpass.txt
            curl -s -o /tmp/o.json -w "code=%{http_code} temps=%{time_total}s taille=%{size_download}\n" --max-time 100 -A "Bayyin/1.0 (github.com/agozel5/bayyin)" -H "Accept: application/json" --data-urlencode "data=$Q" "$u" >> docs/probe-overpass.txt 2>&1 || echo "curl échec $?" >> docs/probe-overpass.txt
            head -c 200 /tmp/o.json >> docs/probe-overpass.txt; echo >> docs/probe-overpass.txt; rm -f /tmp/o.json
          done
          echo "== geofabrik" >> docs/probe-overpass.txt
          curl -sIL https://download.geofabrik.de/europe/france-latest.osm.pbf | grep -i "content-length\|HTTP/" >> docs/probe-overpass.txt
          curl -sL -o /dev/null -w "geofabrik 300MB en %{time_total}s (%{speed_download} o/s)\n" -r 0-300000000 https://download.geofabrik.de/europe/france-latest.osm.pbf >> docs/probe-overpass.txt
          sudo apt-get install -y osmium-tool > /dev/null 2>&1 && osmium --version | head -1 >> docs/probe-overpass.txt
          df -h / | tail -1 >> docs/probe-overpass.txt
      - if: always()
        run: |
          git add docs/probe-overpass.txt
          git -c user.name="bayyin-bot" -c user.email="actions@users.noreply.github.com" commit -m "Sonde Overpass" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep 5; done
