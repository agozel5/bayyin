name: Sonde des sources (temporaire)
on:
  push:
    branches: [main]
    paths: ["scripts/probe-sources.mjs"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-sources.mjs
      - run: |
          git add docs/probe-report.txt
          git -c user.name="bayyin-bot" -c user.email="actions@users.noreply.github.com" commit -m "Rapport de sonde des sources" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
