name: Encyclopédie des additifs

# Met à jour public/data/additives.json depuis Open Food Facts : le 5 de chaque mois, à la demande,
# ou quand le script change.
on:
  schedule:
    - cron: "37 4 5 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build-additives.mjs", ".github/workflows/additives.yml"]

permissions:
  contents: write

concurrency:
  group: additives
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set -o pipefail
          node scripts/build-additives.mjs 2>&1 | tee docs/additives-build.txt
      - name: Enregistrer si la base a changé
        if: always()
        run: |
          git add -A public/data/additives.json docs/additives-build.txt
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git -c user.name="bayyin-bot" -c user.email="actions@users.noreply.github.com" commit -m "Encyclopédie des additifs mise à jour"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
