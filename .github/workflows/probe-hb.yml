name: Sonde produit
on: workflow_dispatch
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          F=$(node -e 'import("./public/lib/off.js").then(m=>console.log(m.FIELDS))')
          { curl -s -A "Bayyin/1.0" "https://world.openfoodfacts.org/api/v2/product/4001686333044.json?fields=$F"; echo; echo ---FULL---;
            curl -s -A "Bayyin/1.0" "https://world.openfoodfacts.org/api/v2/product/4001686333044.json" | python3 -c "import sys,json;p=json.load(sys.stdin).get('product',{});print({k:(v if len(str(v))<300 else str(v)[:300]) for k,v in p.items() if 'ingredient' in k or k in ('lang','lc','languages_codes','product_name','states_tags')})"; } > docs/probe-hb.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add docs/probe-hb.txt; git commit -m "sonde produit"; git push
