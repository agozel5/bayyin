name: Appels au boycott

# Met à jour public/data/boycott.json (exemples de produits de chaque entreprise) chaque mois, à la
# demande, ou quand la liste ou le script changent.
on:
  schedule:
    - cron: "23 4 2 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build-boycott.mjs", "public/lib/boycott.js", ".github/workflows/boycott.yml"]

permissions:
  contents: write

concurrency:
  group: boycott
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chercher les produits
        run: node scripts/build-boycott.mjs
      - name: Enregistrer
        run: |
          git config user.name "bayyin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A public/data/boycott.json
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -m "Exemples de produits des appels au boycott mis à jour"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
