name: Sonde produits AVS (temporaire)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chercher les produits dont l'estampille est sur la liste AVS
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.request
          d = json.load(open("public/data/certified.json"))["orgs"]["avs"]
          fields = "code,product_name,product_name_fr,brands,quantity,image_front_small_url,image_front_url,emb_codes,emb_codes_tags,labels,labels_tags,ingredients_text,ingredients_text_fr,categories_tags,nutriscore_grade,nova_group,nutriments,additives_tags,allergens_tags,traces_tags,ingredients_analysis_tags,countries_tags,lang"
          out = []; log = []
          for st in d["stamps"]:
              m = re.match(r"^([A-Z]{2})(\d{2})(\d{3})(\d{3})(CE|EU)$", st)
              if not m: continue
              tag = f"{m.group(1).lower()}-{m.group(2)}-{m.group(3)}-{m.group(4)}-{m.group(5).lower()}"
              for url in (f"https://world.openfoodfacts.org/facets/packager-codes/{tag}.json?fields={fields}&page_size=50",
                          f"https://world.openfoodfacts.org/cgi/search.pl?action=process&tagtype_0=emb_codes&tag_contains_0=contains&tag_0={tag}&json=1&page_size=50&fields={fields}"):
                  req = urllib.request.Request(url, headers={"User-Agent": "Bayyin/1.0 (store screenshots probe; contact via github.com/agozel5/bayyin)"})
                  try:
                      res = json.load(urllib.request.urlopen(req, timeout=60))
                  except Exception as e:
                      log.append(f"{st} {url[:60]} erreur {e}"); time.sleep(8); continue
                  prods = res.get("products", [])
                  log.append(f"{st} {url[:60]} -> {len(prods)} produits (count {res.get('count')})")
                  for p in prods:
                      ok = p.get("image_front_small_url") and (p.get("ingredients_text_fr") or p.get("ingredients_text"))
                      if ok: out.append({"stamp": st, **p})
                  time.sleep(8)
                  if prods: break
          open("docs/probe-avs.txt", "w").write("\n".join(log) + "\n")
          json.dump(out, open("docs/probe-avs.json", "w"), ensure_ascii=False, indent=1)
          print(len(out), "candidats")
          PY
      - name: Enregistrer
        run: |
          git add docs/probe-avs.json docs/probe-avs.txt
          git -c user.name="bayyin-bot" -c user.email="actions@users.noreply.github.com" commit -m "Sonde AVS" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
