name: Vidéos d'aperçu des stores

# Filme l'app réelle (vrais produits, vraies photos Open Food Facts) et monte une vidéo par langue :
# 886×1920, H.264, 30 i/s, moins de 30 s. Résultat : la branche store-previews (fichiers preview-<langue>.mp4).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright et ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install playwright numpy
          python -m playwright install --with-deps chromium
      - name: Filmer et monter
        run: |
          PORT=3123 node src/server.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do curl -s localhost:3123 > /dev/null && break; sleep 0.5; done
          python scripts/app-preview.py
      - name: Déposer sur la branche store-previews (hors de main, pour ne pas alourdir le dépôt)
        run: |
          mkdir /tmp/pv && cp docs/store/preview/*.mp4 /tmp/pv/
          cd /tmp/pv && git init -q -b store-previews
          git -c user.name="bayyin-bot" -c user.email="actions@users.noreply.github.com" add -A
          git -c user.name="bayyin-bot" -c user.email="actions@users.noreply.github.com" commit -qm "Vidéos d'aperçu des stores"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" store-previews
