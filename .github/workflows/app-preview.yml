name: Vidéos d'aperçu des stores

# Filme l'app réelle (vrais produits, vraies photos Open Food Facts) et monte une vidéo par langue :
# 886×1920, H.264, 30 i/s, moins de 30 s. Résultat : l'archive « apercus » de l'exécution.
on:
  workflow_dispatch:

concurrency:
  group: app-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright et ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Filmer et monter
        run: |
          PORT=3123 node src/server.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do curl -s localhost:3123 > /dev/null && break; sleep 0.5; done
          python scripts/app-preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: apercus
          path: docs/store/preview/*.mp4
          retention-days: 30
