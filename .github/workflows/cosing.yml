name: Base des ingrédients cosmétiques (CosIng)

# Met à jour public/data/cosing.json depuis CosIng (Commission européenne) :
# le 3 de chaque mois, à la demande, ou quand le script change.
on:
  schedule:
    - cron: "41 3 3 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build-cosing.mjs", ".github/workflows/cosing.yml"]

permissions:
  contents: write

concurrency:
  group: cosing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Télécharger et convertir CosIng
        run: |
          set -o pipefail
          node scripts/build-cosing.mjs 2>&1 | tee docs/cosing-build.log
      - name: Enregistrer la base et le journal
        if: always()
        run: |
          git add docs/cosing-build.log public/data/cosing.json 2>/dev/null || git add docs/cosing-build.log
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git -c user.name="bayyin-bot" -c user.email="actions@users.noreply.github.com" commit -m "Base CosIng mise à jour"
          git pull --rebase origin main
          git push origin HEAD:main
