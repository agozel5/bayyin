name: Aperçus des photos

# Ajoute un aperçu flou (ThumbHash) à chaque produit des classements, après leur mise à jour.
on:
  workflow_run:
    workflows: ["Classements"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build-thumbhash.mjs", ".github/workflows/thumbhash.yml"]

permissions:
  contents: write

concurrency:
  group: rankings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Outils (dans un dossier à part)
        run: |
          mkdir -p /tmp/th && cd /tmp/th && npm init -y >/dev/null && npm install --no-audit --no-fund sharp@0.33.5 thumbhash@0.1.1
          ln -s /tmp/th/node_modules "$GITHUB_WORKSPACE/scripts/node_modules"
      - name: Calculer les aperçus
        run: node scripts/build-thumbhash.mjs
      - name: Enregistrer
        run: |
          rm -f scripts/node_modules
          git add -A public/data/rankings
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git -c user.name="bayyin-bot" -c user.email="actions@users.noreply.github.com" commit -m "Aperçus des photos des classements"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
