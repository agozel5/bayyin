name: Sonde maquillage
on: workflow_dispatch
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Bayyin/1.0 (github.com/agozel5/bayyin)"
          {
          for q in "mascara" "rouge a levres" "fond de teint" "maybelline" "vernis a ongles" "eyeliner" "fard a paupieres" "l oreal mascara"; do
            r=$(curl -s -m 60 -A "$UA" "https://world.openbeautyfacts.org/cgi/search.pl?search_terms=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")&search_simple=1&action=process&json=1&page_size=24&fields=code,product_name,ingredients_text,categories_tags" | python3 -c "
          import sys,json
          try:
            d=json.load(sys.stdin); p=d.get('products',[])
            print(d.get('count'), 'avec ingr:', sum(1 for x in p if x.get('ingredients_text')), '|', '; '.join((x.get('product_name') or '?')[:30] for x in p[:5]))
          except Exception as e: print('ERR', e)")
            echo "Q $q -> $r"; sleep 6
          done
          for c in lipsticks mascaras foundations eyeliners eye-shadows nail-polishes blushes lip-glosses face-powders concealers make-up makeup lip-balms bb-creams eyebrow-pencils lip-liners highlighters primers make-up-removers; do
            r=$(curl -sL -m 60 -A "$UA" "https://world.openbeautyfacts.org/api/v2/search?categories_tags=en:$c&page_size=24&fields=code,ingredients_text,countries_tags" | python3 -c "
          import sys,json
          try:
            d=json.load(sys.stdin); p=d.get('products',[])
            print(d.get('count'), 'avec ingr (24 premiers):', sum(1 for x in p if x.get('ingredients_text')), 'fr:', sum(1 for x in p if 'en:france' in (x.get('countries_tags') or [])))
          except Exception as e: print('ERR', e)")
            echo "C $c -> $r"; sleep 6
          done
          } > docs/probe-obf.txt 2>&1
          cat docs/probe-obf.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add docs/probe-obf.txt; git commit -m "sonde maquillage"; git push
