# Publie le dossier public/ sur GitHub Pages à chaque push sur main,
# après avoir vérifié que les tests passent.
name: Tests et publication

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Les robots de données poussent avec le jeton GitHub, ce qui ne relance pas ce workflow :
  # on republie donc après chacun d'eux.
  workflow_run:
    workflows: ["Rappels de produits (RappelConso)", "Listes des organismes halal", "Encyclopédie des additifs", "Base des ingrédients cosmétiques (CosIng)", "Base des médicaments", "Images des stores"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
