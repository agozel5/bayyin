name: Listes des organismes halal

# Met à jour public/data/certified.json chaque lundi, à la demande, ou quand le script change.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build-certified.mjs", ".github/workflows/certified.yml"]

permissions:
  contents: write

concurrency:
  group: certified
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Télécharger les listes officielles
        run: |
          set -o pipefail
          node scripts/build-certified.mjs 2>&1 | tee docs/certified-build.txt
      - name: Enregistrer si les listes ont changé
        if: always()
        run: |
          git add -A public/data/certified.json docs/certified-build.txt
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git -c user.name="bayyin-bot" -c user.email="actions@users.noreply.github.com" commit -m "Listes des organismes halal mises à jour"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
