name: probe-world
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: build world map + probe origins
        run: |
          mkdir -p /tmp/w && cd /tmp/w && npm init -y >/dev/null && npm i d3-geo@3 >/dev/null 2>&1
          curl -sL https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson -o ne.json
          ls -la ne.json
          cat > build.mjs <<'JS'
          import { readFileSync, writeFileSync } from "fs";
          import { geoNaturalEarth1, geoPath } from "d3-geo";
          const ne = JSON.parse(readFileSync("ne.json", "utf8"));
          const feats = ne.features.filter((f) => f.properties.CONTINENT !== "Antarctica");
          const W = 1000, H = 500;
          const proj = geoNaturalEarth1().fitExtent([[4, 4], [W - 4, H - 4]], { type: "FeatureCollection", features: feats });
          const path = geoPath(proj).digits(0);
          const slug = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
          const out = feats.map((f) => {
            const p = f.properties;
            const iso = p.ISO_A2_EH && p.ISO_A2_EH !== "-99" ? p.ISO_A2_EH : p.ISO_A2 !== "-99" ? p.ISO_A2 : "";
            const names = [...new Set([p.NAME, p.NAME_LONG, p.NAME_EN, p.ADMIN, p.GEOUNIT, p.FORMAL_EN].map(slug).filter(Boolean))];
            return { i: iso, k: names, c: slug(p.CONTINENT), r: slug(p.SUBREGION), eu: p.EU_A3 ? 1 : 0, d: path(f) };
          });
          writeFileSync("world.json", JSON.stringify({ w: W, h: H, c: out }));
          console.log("countries", out.length, "bytes", JSON.stringify(out).length);
          JS
          node build.mjs
          node -e 'const w=require("/tmp/w/world.json");console.log(w.c.slice(0,3).map(x=>({...x,d:x.d.slice(0,60)})));console.log(JSON.stringify(w.c.map(x=>x.i+":"+x.k[0]+":"+x.c+":"+(x.eu||0))).slice(0,3000))' 
          mkdir -p $GITHUB_WORKSPACE/docs && cp world.json $GITHUB_WORKSPACE/docs/probe-world.json
          # Origines sur une vraie fiche
          Q="https://world.openfoodfacts.org/cgi/search.pl?search_terms=biscuits%20avoine%20pepites%20chocolat%20carrefour%20bio&search_simple=1&action=process&json=1&page_size=5&fields=code,product_name,brands,origin_fr,origin,origins_tags,manufacturing_places"
          for i in 1 2 3; do curl -s -A "Bayyin-probe/1.0 (abdullahgozel@hotmail.com)" "$Q" > s.json && break; sleep 5; done
          head -c 1500 s.json > $GITHUB_WORKSPACE/docs/probe-world.txt; echo >> $GITHUB_WORKSPACE/docs/probe-world.txt
          CODE=$(node -e 'try{const d=require("/tmp/w/s.json");console.log((d.products||[])[0]?.code||"")}catch{console.log("")}')
          echo "CODE=$CODE" >> $GITHUB_WORKSPACE/docs/probe-world.txt
          if [ -n "$CODE" ]; then
            curl -s -A "Bayyin-probe/1.0" "https://world.openfoodfacts.org/api/v2/product/$CODE.json?fields=origin_fr,origins_tags,ingredients,environmental_score_data,ecoscore_data" > p.json
            node -e '
              const d=require("/tmp/w/p.json").product||{};
              console.log("origin_fr:", d.origin_fr);
              console.log("origins_tags:", d.origins_tags);
              const walk=(l,o=[])=>{(l||[]).forEach(x=>{o.push([x.text,x.origins,x.percent_estimate]);walk(x.ingredients,o)});return o};
              console.log("ingredients:", JSON.stringify(walk(d.ingredients)));
              const e=(d.environmental_score_data||d.ecoscore_data||{}).adjustments||{};
              console.log("origins_of_ingredients:", JSON.stringify(e.origins_of_ingredients||{}).slice(0,1500));
            ' >> $GITHUB_WORKSPACE/docs/probe-world.txt
          fi
      - run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add docs/probe-world.json docs/probe-world.txt && git commit -m "sonde carte du monde" && git pull --rebase && git push
